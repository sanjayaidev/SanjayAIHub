<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>SanjayAIHub · Prompt Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0c10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .dashboard {
      max-width: 1400px;
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      background: rgba(18, 22, 28, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 0;
      box-shadow: 0 30px 60px -12px rgba(0,0,0,0.9);
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .sidebar {
      width: 240px;
      min-width: 240px;
      background: rgba(12, 16, 22, 0.8);
      border-right: 1px solid rgba(255,255,255,0.04);
      padding: 18px 12px 14px 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.25s ease;
      z-index: 100;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 0 6px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #00e8a2, #00b37a);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #060d0b;
      box-shadow: 0 8px 24px -6px rgba(0,232,162,0.3);
      flex-shrink: 0;
    }

    .brand-text h1 { font-size: 18px; font-weight: 700; color: #f0f4fe; letter-spacing: -0.3px; }
    .brand-text span { font-size: 11px; color: #8896b0; display: block; margin-top: 1px; }

    .sidebar-section { flex-shrink: 0; margin-bottom: 2px; }
    .sidebar-section-label {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px;
      color: #4d5872; padding: 4px 8px 4px 8px; font-weight: 700;
    }

    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-radius: 8px;
      color: #8896b0; font-size: 12.5px; cursor: pointer;
      transition: 0.15s; font-weight: 500;
      user-select: none; border: 1px solid transparent;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.04); color: #eef2f9; }
    .sidebar-item.active {
      background: rgba(0,232,162,0.1);
      color: #00e8a2;
      border-color: rgba(0,232,162,0.12);
    }
    .sidebar-item i { width: 16px; font-size: 14px; text-align: center; flex-shrink: 0; }
    .sidebar-item .badge {
      margin-left: auto;
      font-size: 8px;
      background: rgba(255,255,255,0.06);
      padding: 1px 7px;
      border-radius: 8px;
      color: #5b6a84;
      font-weight: 600;
    }

    .sidebar-divider {
      height: 1px;
      background: rgba(255,255,255,0.04);
      margin: 6px 8px 8px 8px;
      flex-shrink: 0;
    }

    .back-hub {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 10px;
      flex-shrink: 0;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      background: rgba(10, 12, 16, 0.6);
    }

    .chat-header {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 44px;
      gap: 10px;
      background: rgba(0,0,0,0.2);
    }
    .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .header-left .page-title { color: #eef2f9; font-weight: 600; font-size: 14px; }
    .header-left .page-subtitle { color: #6a7a94; font-size: 11px; margin-left: 6px; font-weight: 400; display: none; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* ── Explore Cards (compact, 2:1 image, full width) ── */
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 6px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.015);
      flex-shrink: 0;
    }
    .explore-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 10px 10px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.06);
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      min-height: auto;
      width: 100%;
    }
    .explore-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0,232,162,0.25);
      background: rgba(255,255,255,0.045);
      box-shadow: 0 6px 16px -6px rgba(0,0,0,0.5);
    }
    .explore-card .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .explore-card .thumb {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      flex-shrink: 0;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .explore-card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .explore-card .info {
      flex: 1;
      min-width: 0;
    }
    .explore-card .info .title {
      font-size: 11px;
      font-weight: 700;
      color: #eef2f9;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }
    .explore-card .info .desc {
      font-size: 9px;
      color: #8896b0;
      margin-top: 1px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* ── Explore Grid with Hide Button ── */
.explore-grid-wrapper {
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.23, 1, 0.32, 1), 
              opacity 0.3s ease,
              padding 0.3s ease;
  max-height: 300px;
  opacity: 1;
  padding: 0;
}

.explore-grid-wrapper.hidden {
  max-height: 0;
  opacity: 0;
  padding: 0;
  margin: 0;
  border: none;
  pointer-events: none;
}

.explore-grid-wrapper .toggle-btn {
  position: absolute;
  top: 4px;
  right: 8px;
  z-index: 5;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  color: #8896b0;
  font-size: 10px;
  padding: 2px 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  gap: 4px;
}
.explore-grid-wrapper .toggle-btn:hover {
  background: rgba(255,255,255,0.12);
  color: #eef2f9;
  border-color: rgba(255,255,255,0.15);
}
.explore-grid-wrapper .toggle-btn i {
  font-size: 9px;
}

/* Show toggle button only on larger screens (where it fits) */
@media (max-width: 480px) {
  .explore-grid-wrapper .toggle-btn {
    top: 2px;
    right: 4px;
    font-size: 8px;
    padding: 1px 6px;
  }
}
    .explore-card .card-image {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      aspect-ratio: 2 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .explore-card .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .explore-card .arrow {
      font-size: 10px;
      color: #4d5872;
      flex-shrink: 0;
      transition: 0.2s;
      margin-left: auto;
    }
    .explore-card:hover .arrow {
      color: #00e8a2;
      transform: translateX(3px);
    }
    .explore-card.promo-course .thumb { border-color: rgba(167,139,250,0.2); }
    .explore-card.promo-service .thumb { border-color: rgba(255,159,67,0.2); }
    .explore-card.promo-course .card-image { border-color: rgba(167,139,250,0.15); }
    .explore-card.promo-service .card-image { border-color: rgba(255,159,67,0.15); }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
      flex-shrink: 0;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1 0 80px;
      min-width: 70px;
    }
    .filter-group label {
      font-size: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6a7a94;
      font-weight: 600;
    }
    .filter-group select,
    .filter-group input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 5px 7px;
      color: #eef2f9;
      font-size: 10px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: 0.2s;
      width: 100%;
      cursor: pointer;
    }
    .filter-group select option { background: #1a1f29; color: #eef2f9; }
    .filter-group select:focus,
    .filter-group input:focus {
      border-color: #00e8a2;
      box-shadow: 0 0 0 3px rgba(0,232,162,0.08);
    }

    .prompt-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: row;
      min-height: 0;
    }

    .prompt-list {
      width: 45%;
      min-width: 280px;
      overflow-y: auto;
      padding: 8px 10px;
      border-right: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
      background: rgba(0,0,0,0.15);
      max-height: 100%;
    }
    .prompt-list::-webkit-scrollbar { width: 4px; }
    .prompt-list::-webkit-scrollbar-thumb { background: #3d4452; border-radius: 10px; }

    .prompt-list-item {
      display: flex;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.02);
    }
    .prompt-list-item:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.06);
    }
    .prompt-list-item.active {
      background: rgba(0,232,162,0.08);
      border-color: rgba(0,232,162,0.2);
    }

    .prompt-list-item .prompt-thumb {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      flex-shrink: 0;
      overflow: hidden;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      position: relative;
      justify-content: center;
      font-size: 20px;
      color: #3a4356;
    }
    .prompt-list-item .prompt-thumb img,
    .prompt-list-item .prompt-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .prompt-list-item .prompt-info {
      flex: 1;
      min-width: 0;
    }
    .prompt-list-item .prompt-info .headline {
      font-size: 12px;
      font-weight: 600;
      color: #eef2f9;
      margin-bottom: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prompt-list-item .prompt-info .desc {
      font-size: 10px;
      color: #6a7a94;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .prompt-list-item .prompt-info .meta {
      display: flex;
      gap: 4px;
      margin-top: 3px;
      font-size: 8px;
      color: #4d5872;
      flex-wrap: wrap;
    }
    .prompt-list-item .prompt-info .meta .tag {
      background: rgba(255,255,255,0.06);
      padding: 1px 6px;
      border-radius: 6px;
      color: #6a7a94;
    }
    .prompt-list-item .prompt-info .meta .tag.category-t2i { color: #00e8a2; background: rgba(0,232,162,0.1); }
    .prompt-list-item .prompt-info .meta .tag.category-t2v { color: #4d8eff; background: rgba(77,142,255,0.1); }
    .prompt-list-item .prompt-info .meta .tag.category-edit { color: #f472b6; background: rgba(244,114,182,0.1); }
    .prompt-list-item .prompt-info .meta .tag.category-i2v { color: #a78bfa; background: rgba(167,139,250,0.1); }
    .prompt-list-item .prompt-info .meta .tag.category-v2v { color: #fbbf24; background: rgba(251,191,36,0.1); }

    .prompt-list-empty {
      color: #5b6a84;
      text-align: center;
      padding: 40px 20px;
      font-size: 13px;
    }

    .prompt-preview {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(0,0,0,0.2);
      transition: all 0.2s;
    }
    .prompt-preview::-webkit-scrollbar { width: 4px; }
    .prompt-preview::-webkit-scrollbar-thumb { background: #3d4452; border-radius: 10px; }

    .preview-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #5b6a84;
      gap: 10px;
      text-align: center;
    }
    .preview-empty i { font-size: 36px; color: #3a4356; }
    .preview-empty p { font-size: 12px; line-height: 1.6; }

    .preview-header { flex-shrink: 0; }
    .preview-header .preview-title {
      font-size: 18px;
      font-weight: 700;
      color: #eef2f9;
      margin-bottom: 3px;
    }
    .preview-header .preview-category {
      font-size: 11px;
      color: #6a7a94;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    .preview-header .preview-category .cat-badge {
      background: rgba(0,232,162,0.1);
      color: #00e8a2;
      padding: 1px 8px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 600;
    }

    .preview-media {
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      position: relative;
      max-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .preview-media img,
    .preview-media video {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 10px;
    }
    .preview-media .media-placeholder {
      padding: 20px;
      color: #4d5872;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .preview-media .media-placeholder i { font-size: 32px; color: #3a4356; }
    .preview-media iframe {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 9/16;
      border: none;
      border-radius: 10px;
      background: #000;
    }

    .preview-prompt-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 10px 14px;
      flex-shrink: 0;
    }
    .preview-prompt-box .label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6a7a94;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .preview-prompt-box .prompt-text {
      color: #eef2f9;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .preview-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }
    .preview-actions button {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 10px;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-primary {
      background: #00e8a2;
      color: #060d0b;
      box-shadow: 0 6px 16px -6px rgba(0,232,162,0.3);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #8896b0;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #eef2f9; }

    .loading-spinner {
      text-align: center;
      padding: 30px;
      color: #5b6a84;
      grid-column: 1 / -1;
    }
    .loading-spinner .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(0,232,162,0.15);
      border-top-color: #00e8a2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a1f29;
      color: #eef2f9;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      font-size: 12px;
      max-width: 360px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(0,232,162,0.3); }
    .toast.error { border-color: rgba(255,90,90,0.3); color: #ff9b9b; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.visible { display: block; }
    .hamburger-btn {
      display: none;
      background: transparent;
      border: none;
      color: #8896b0;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
    }

    @media (max-width: 1024px) {
      .prompt-list { width: 40%; min-width: 220px; }
    }

    @media (max-width: 820px) {
      .dashboard { border-radius: 0; height: 100vh; max-height: 100vh; }
      .dashboard { height: 100dvh; max-height: 100dvh; }
      body { padding: 0; }

      .hamburger-btn { display: flex; }
      .sidebar {
        position: fixed;
        left: -280px;
        top: 0; bottom: 0;
        width: 280px;
        z-index: 1000;
        transition: left 0.25s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,0.6);
        background: rgba(12,16,22,0.98);
        border-radius: 0;
        transform: translateX(0);
      }
      .sidebar.mobile-open { left: 0; }

      .prompt-layout { flex-direction: column; min-height: 0; }
      .prompt-list {
        width: 100%;
        min-width: unset;
        flex: 1;
        max-height: none;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        overflow-y: auto;
      }
      .prompt-preview {
        padding: 12px 12px;
        flex: 1;
        min-height: 0;
        max-height: none;
        overflow-y: auto;
      }
      .preview-media { max-height: 220px; }
      .preview-media img,
      .preview-media video { max-height: 220px; }
      .filter-bar { padding: 6px 10px; gap: 4px; }
      .filter-group { min-width: 60px; flex: 1 0 70px; }
      .chat-header { padding: 6px 10px; flex-wrap: wrap; min-height: 38px; }
      .header-right { flex-wrap: wrap; }
      .prompt-list-item .prompt-thumb { width: 48px; height: 48px; }
      .preview-header .preview-title { font-size: 16px; }
      .header-left .page-subtitle { display: inline; }

      .prompt-preview:not(.fullscreen-mobile) {
        display: none;
      }
      .explore-grid {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 6px 8px;
      }
      .explore-card { 
        min-height: auto; 
        padding: 6px 8px 8px 8px; 
        gap: 4px;
      }
      .explore-card .thumb { width: 24px; height: 24px; }
      .explore-card .info .title { font-size: 10px; }
      .explore-card .info .desc { font-size: 8px; }
      .explore-card .card-image { aspect-ratio: 2 / 1; border-radius: 4px; }
    }

    @media (max-width: 480px) {
      .filter-bar { flex-direction: row; flex-wrap: wrap; gap: 3px; }
      .filter-group { min-width: 50px; flex: 1 0 60px; }
      .preview-header .preview-title { font-size: 14px; }
      .prompt-list-item .prompt-info .headline { font-size: 11px; }
      .prompt-list-item { padding: 6px 8px; gap: 6px; }

        grid-template-columns: 1fr;

      .explore-card { 
        padding: 4px 6px 6px 6px;
        gap: 3px;

      .explore-card .thumb { width: 20px; height: 20px; border-radius: 4px; }
      .explore-card .info .title { font-size: 9px; }

    @media (min-width: 821px) {
      .hamburger-btn { display: none !important; }
      .sidebar-overlay { display: none !important; }

    .prompt-preview.fullscreen-mobile {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 200;
      background: rgba(10,12,16,0.98);
      padding: 16px 14px;
      overflow-y: auto;

      display: flex;
      position: sticky;
      top: 0;
      background: rgba(10,12,16,0.9);
      padding: 6px 0;
      margin-bottom: 6px;
      z-index: 10;
      justify-content: flex-end;
    }
    .preview-close { display: none; }
    .prompt-preview.fullscreen-mobile .preview-close { display: flex; }
    .preview-close button {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #eef2f9;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 11px;
      display: flex;

</head>

<script>
(function() {
  const MODULE_KEY_TO_CATEGORY = {
    'text-to-image': 't2i','text-to-video':'t2v','image-edit':'edit',
    'image-to-video':'i2v','video-to-video':'v2v'
  };
  const CATEGORY_LABELS = { 't2i':'Text to Image','t2v':'Text to Video','edit':'Image Edit','i2v':'Image to Video','v2v':'Video to Edit' };
  const CATEGORY_ICONS = { 't2i':'fa-image','t2v':'fa-video','edit':'fa-pen-fancy','i2v':'fa-film','v2v':'fa-rotate' };

  let prompts = [], filteredPrompts = [], selectedPromptId = null;
  let currentCategory = 'all', currentSubCategory = '', currentSearch = '', currentSort = 'newest';
  let favoriteIds = new Set();
  let suppressAutoSelect = false;

  function getPromptIdFromLocation() {
    const pathMatch = window.location.pathname.match(/\/prompts\/([^/?#]+)/);
    if (pathMatch) return decodeURIComponent(pathMatch[1]);
    const params = new URLSearchParams(window.location.search);
    return params.get('id') || null;
  }

  function promptShareUrl(id) {
    return `${window.location.origin}/prompts/${encodeURIComponent(id)}`;
  }

  function syncUrlForPrompt(id, replace) {
    const url = id ? promptShareUrl(id) : '/prompts.html';
    const state = { promptId: id || null };
    if (replace) history.replaceState(state, '', url);
    else history.pushState(state, '', url);
  }

  const promptList = document.getElementById('promptList');
  const promptPreview = document.getElementById('promptPreview');
  const subCategoryFilter = document.getElementById('subCategoryFilter');
  const searchFilter = document.getElementById('searchFilter');
  const sortFilter = document.getElementById('sortFilter');
  const promptCount = document.getElementById('promptCount');
  const toastEl = document.getElementById('toast');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  function isMobile() { return window.innerWidth < 821; }

  function escapeHtml(text) { if (!text) return ''; const d=document.createElement('div'); d.textContent=text; return d.innerHTML; }

  function showToast(msg, type='info') {
    toastEl.textContent = msg;
    toastEl.className = `toast ${type} show`;
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), 2800);
  }

  hamburgerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.toggle('mobile-open');
    sidebarOverlay.classList.toggle('visible');
  });
  sidebarOverlay.addEventListener('click', () => {
    sidebar.classList.remove('mobile-open');
    sidebarOverlay.classList.remove('visible');
  });

  document.querySelectorAll('.sidebar-item[data-category]').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.sidebar-item[data-category]').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      currentCategory = item.dataset.category;
      applyFilters();
      sidebar.classList.remove('mobile-open');
      sidebarOverlay.classList.remove('visible');
    });
  });

  async function loadPrompts() {
    promptList.innerHTML = `<div class="loading-spinner"><div class="spinner"></div> Loading prompts...</div>`;
    try {
      const res = await fetch('/api/modules/prompt-library/prompts');
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'Failed to load');
      prompts = data.prompts.map(p => ({
        id: p.id,
        headline: p.headline,
        description: p.description,
        category: MODULE_KEY_TO_CATEGORY[p.module_key] || p.module_key,
        module_key: p.module_key,
        sub_category: p.sub_category,
        full_prompt: p.full_prompt,
        tags: p.tags || [],
        media_type: p.media_type,
        img: p.img,
        demo_url: p.demo_url,
        instagram_shortcode: p.instagram_shortcode,
        views: p.views,
        popular: p.is_featured,
        created_at: p.created_at
      }));
      if (window.AUTH && AUTH.isLoggedIn()) await loadFavorites();

      const deepLinkId = getPromptIdFromLocation();
      const deepLinkPrompt = deepLinkId ? prompts.find(p => p.id === deepLinkId) : null;
      if (deepLinkId && !deepLinkPrompt) {
        showToast('That prompt link is no longer available.', 'error');
      }
      if (deepLinkPrompt) {
        currentCategory = deepLinkPrompt.category;
        currentSubCategory = '';
        currentSearch = '';
        searchFilter.value = '';
        document.querySelectorAll('.sidebar-item[data-category]').forEach(el => {
          el.classList.toggle('active', el.dataset.category === currentCategory);
        });
        updateSubCategories();
        subCategoryFilter.value = '';
        suppressAutoSelect = true;
        applyFilters();
        suppressAutoSelect = false;
        selectPrompt(deepLinkPrompt.id, { replaceUrl: true });
      } else {
        updateSubCategories();
        applyFilters();
      }
    } catch(err) {
      promptList.innerHTML = `<div class="prompt-list-empty">⚠️ ${escapeHtml(err.message)}</div>`;
      showToast(err.message, 'error');
    }
  }

  async function loadFavorites() {
    try {
      const res = await fetch('/api/modules/prompt-library/favorites', { headers: AUTH.getAuthHeader() });
      const data = await res.json();
      if (res.ok && data.success) favoriteIds = new Set(data.favorites);
    } catch(_) {}
  }

  function updateSubCategories() {
    const cats = currentCategory === 'all' ? ['t2i','t2v','edit','i2v','v2v'] : [currentCategory];
    const subCats = new Set();
    prompts.forEach(p => { if (cats.includes(p.category) && p.sub_category) subCats.add(p.sub_category); });
    subCategoryFilter.innerHTML = '<option value="">All</option>';
    [...subCats].sort().forEach(sc => {
      subCategoryFilter.innerHTML += `<option value="${escapeHtml(sc)}">${escapeHtml(sc)}</option>`;
    });
  }

  function applyFilters() {
    const cats = currentCategory === 'all' ? ['t2i','t2v','edit','i2v','v2v'] : [currentCategory];
    filteredPrompts = prompts.filter(p => {
      if (!cats.includes(p.category)) return false;
      if (currentSubCategory && p.sub_category !== currentSubCategory) return false;
      if (currentSearch) {
        const s = currentSearch.toLowerCase();
        return p.headline.toLowerCase().includes(s) || p.description.toLowerCase().includes(s) ||
               p.full_prompt.toLowerCase().includes(s) || p.tags.some(t => t.toLowerCase().includes(s));
      }
      return true;
    });
    switch(currentSort) {
      case 'popular': filteredPrompts.sort((a,b) => (b.popular?1:0)-(a.popular?1:0) || b.views-a.views); break;
      case 'views': filteredPrompts.sort((a,b) => b.views-a.views); break;
      default: filteredPrompts.sort((a,b) => new Date(b.created_at)-new Date(a.created_at));
    }
    updateCounts();
    renderList();

    if (suppressAutoSelect) return;

    if (!filteredPrompts.length) {
      selectedPromptId = null;
      showEmptyPreview();
      return;
    }

    if (isMobile()) {
      if (!selectedPromptId || !filteredPrompts.some(p => p.id === selectedPromptId)) {
        selectedPromptId = null;
      }
      renderList();
      return;
    }

    if (!selectedPromptId || !filteredPrompts.some(p => p.id === selectedPromptId)) {
      selectPrompt(filteredPrompts[0].id);
    } else {
      renderPreview(selectedPromptId);
    }
  }

  function updateCounts() {
    const counts = { all: prompts.length, t2i:0, t2v:0, edit:0, i2v:0, v2v:0 };
    prompts.forEach(p => { if (counts[p.category] !== undefined) counts[p.category]++; });
    document.getElementById('countAll').textContent = counts.all;
    document.getElementById('countT2I').textContent = counts.t2i;
    document.getElementById('countT2V').textContent = counts.t2v;
    document.getElementById('countEdit').textContent = counts.edit;
    document.getElementById('countI2V').textContent = counts.i2v;
    document.getElementById('countV2V').textContent = counts.v2v;
    promptCount.textContent = `${filteredPrompts.length} prompts`;
  }

  function renderList() {
    if (!filteredPrompts.length) { promptList.innerHTML = `<div class="prompt-list-empty">No prompts found</div>`; return; }
    promptList.innerHTML = filteredPrompts.map(p => {
      const active = p.id === selectedPromptId;
      const catLabel = CATEGORY_LABELS[p.category] || p.category;
      const catClass = `category-${p.category}`;
      const icon = CATEGORY_ICONS[p.category] || 'fa-file';
      const isFav = favoriteIds.has(p.id);
      return `<div class="prompt-list-item ${active?'active':''}" onclick="selectPrompt('${p.id}')" data-id="${p.id}">
        <div class="prompt-thumb">
          ${p.img ? `<img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.headline)}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fas ${icon}\\' style=\\'font-size:20px;color:#3a4356;\\'></i>'" />` :
          `<i class="fas ${icon}" style="font-size:20px;color:#3a4356;"></i>`}
          ${isFav ? '<i class="fas fa-heart" style="position:absolute;top:3px;right:3px;color:#e1306c;font-size:8px;text-shadow:0 1px 2px rgba(0,0,0,0.5);"></i>' : ''}
        </div>
        <div class="prompt-info">
          <div class="headline">${escapeHtml(p.headline)}</div>
          <div class="desc">${escapeHtml(p.description)}</div>
          <div class="meta"><span class="tag ${catClass}">${escapeHtml(catLabel)}</span>${p.sub_category?`<span class="tag">${escapeHtml(p.sub_category)}</span>`:''}${p.popular?'<span class="tag" style="color:#fbbf24;background:rgba(251,191,36,0.1);">⭐</span>':''}</div>
        </div>
      </div>`;
    }).join('');
  }

  window.selectPrompt = function(id, opts = {}) {
    selectedPromptId = id;
    renderList();
    renderPreview(id);
    sidebar.classList.remove('mobile-open');
    sidebarOverlay.classList.remove('visible');
    syncUrlForPrompt(id, !!opts.replaceUrl);
    if (isMobile()) {
      promptPreview.classList.add('fullscreen-mobile');
      if (!promptPreview.querySelector('.preview-close')) {
        const closeDiv = document.createElement('div');
        closeDiv.className = 'preview-close';
        closeDiv.innerHTML = `<button onclick="closeFullscreenPreview()"><i class="fas fa-arrow-left"></i> Back</button>`;
        promptPreview.prepend(closeDiv);
      }
    } else {
      promptPreview.classList.remove('fullscreen-mobile');
    }
  };
  window.closeFullscreenPreview = function() {
    promptPreview.classList.remove('fullscreen-mobile');
    const closeBtn = promptPreview.querySelector('.preview-close');
    if (closeBtn) closeBtn.remove();
    if (isMobile()) {
      selectedPromptId = null;
      renderList();
      showEmptyPreview();
      syncUrlForPrompt(null, false);
    }
  };

  function renderPreview(id) {
    const p = prompts.find(p => p.id === id);
    if (!p) { showEmptyPreview(); return; }
    const catLabel = CATEGORY_LABELS[p.category] || p.category;
    const catClass = `category-${p.category}`;
    const icon = CATEGORY_ICONS[p.category] || 'fa-file';
    const isFav = favoriteIds.has(p.id);
    let mediaHtml = '';
    if (p.instagram_shortcode) {
      mediaHtml = `<iframe src="/api/reels/proxy?shortcode=${encodeURIComponent(p.instagram_shortcode)}" allowfullscreen loading="lazy" scrolling="no"></iframe>`;
    } else if (p.img) {
      mediaHtml = `<img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.headline)}" onerror="this.parentElement.innerHTML='<div class=\\'media-placeholder\\'><i class=\\'fas ${icon}\\'></i><span>No image</span></div>'" />`;
    } else if (p.demo_url) {
      mediaHtml = `<img src="${escapeHtml(p.demo_url)}" alt="${escapeHtml(p.headline)}" onerror="this.parentElement.innerHTML='<div class=\\'media-placeholder\\'><i class=\\'fas ${icon}\\'></i><span>No preview</span></div>'" />`;
    } else {
      mediaHtml = `<div class="media-placeholder"><i class="fas ${icon}"></i><span>No media</span></div>`;
    }
    promptPreview.innerHTML = `
      ${promptPreview.querySelector('.preview-close') ? promptPreview.querySelector('.preview-close').outerHTML : ''}
      <div class="preview-header">
        <div class="preview-title">${escapeHtml(p.headline)}</div>
        <div class="preview-category"><span class="cat-badge ${catClass}">${escapeHtml(catLabel)}</span>${p.sub_category?` → ${escapeHtml(p.sub_category)}`:''}<span style="color:#4d5872;margin-left:8px;">👁️ ${p.views}</span>${p.popular?' ⭐':''}</div>
      </div>
      <div class="preview-media">${mediaHtml}</div>
      <div class="preview-prompt-box"><div class="label"><i class="fas fa-quote-right"></i> Full Prompt</div><div class="prompt-text">${escapeHtml(p.full_prompt)}</div></div>
      <div class="preview-actions">
        <button class="btn-primary" onclick="copyPrompt('${p.id}')"><i class="fas fa-copy"></i> Copy</button>
        <button class="btn-secondary" onclick="usePrompt('${p.id}')"><i class="fas fa-wand-magic-sparkles"></i> Use</button>
        <button class="btn-secondary" onclick="toggleFavorite('${p.id}')"><i class="fa${isFav?'s':'r'} fa-heart" style="${isFav?'color:#e1306c;':''}"></i> ${isFav?'Fav':'Favorite'}</button>
        <button class="btn-secondary" onclick="sharePrompt('${p.id}')"><i class="fas fa-share-nodes"></i> Share</button>
        ${p.tags?.length ? `<span style="display:flex;gap:3px;flex-wrap:wrap;margin-left:auto;">${p.tags.map(t=>`<span style="font-size:8px;color:#6a7a94;background:rgba(255,255,255,0.05);padding:1px 6px;border-radius:6px;">#${escapeHtml(t)}</span>`).join('')}</span>` : ''}
      </div>
    `;
    fetch(`/api/modules/prompt-library/${p.id}/view`, { method:'POST' }).catch(()=>{});
  }
// ── Toggle Explore Section ──
const exploreWrapper = document.getElementById('exploreWrapper');
const toggleBtn = document.getElementById('toggleExploreBtn');
let exploreHidden = false;

if (toggleBtn && exploreWrapper) {
  toggleBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    exploreHidden = !exploreHidden;
    
    if (exploreHidden) {
      exploreWrapper.classList.add('hidden');
      toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Show';
      toggleBtn.style.position = 'static';
      toggleBtn.style.margin = '4px auto';
      toggleBtn.style.width = 'fit-content';
      toggleBtn.style.background = 'rgba(255,255,255,0.04)';
      // Move button outside the hidden wrapper so it remains visible
      exploreWrapper.insertAdjacentElement('afterend', toggleBtn);
    } else {
      exploreWrapper.classList.remove('hidden');
      toggleBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Hide';
      toggleBtn.style.position = 'absolute';
      toggleBtn.style.margin = '0';
      toggleBtn.style.width = 'auto';
      toggleBtn.style.background = 'rgba(255,255,255,0.06)';
      exploreWrapper.prepend(toggleBtn);
    }
  });
}
  function showEmptyPreview() {
    promptPreview.innerHTML = `<div class="preview-empty"><i class="fas fa-hand-pointer"></i><p>Select a prompt to preview</p></div>`;
  }

  window.copyPrompt = function(id) {
    const p = prompts.find(p => p.id === id);
    if (!p) return;
    navigator.clipboard.writeText(p.full_prompt).then(() => showToast('Copied!','success')).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = p.full_prompt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!','success');
    });
  };

  window.usePrompt = function(id) {
    const p = prompts.find(p => p.id === id);
    if (!p) return;
    const page = window.MODULES?.pages?.[p.module_key];
    if (!page) { showToast('Generator not wired yet. Copy the prompt.','info'); return; }
    localStorage.setItem('prefill_prompt', JSON.stringify({ prompt: p.full_prompt, module_key: p.module_key, from_prompt_id: p.id }));
    showToast(`Opening "${p.headline}"...`,'info');
    window.location.href = page;
  };

  window.sharePrompt = function(id) {
    const p = prompts.find(p => p.id === id);
    if (!p) return;
    const url = promptShareUrl(id);
    if (navigator.share) {
      navigator.share({ title: p.headline, text: p.description || p.headline, url }).catch(() => {});
      return;
    }
    navigator.clipboard.writeText(url).then(() => showToast('Link copied!', 'success')).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Link copied!', 'success');
    });
  };

  window.toggleFavorite = async function(id) {
    if (!window.AUTH || !AUTH.isLoggedIn()) { showToast('Log in to favorite.','info'); return; }
    try {
      const res = await fetch(`/api/modules/prompt-library/favorites/${id}`, { method:'POST', headers: AUTH.getAuthHeader() });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message);
      if (data.favorited) { favoriteIds.add(id); showToast('Added','success'); }
      else { favoriteIds.delete(id); showToast('Removed','info'); }
      renderList();
      if (selectedPromptId === id) renderPreview(id);
    } catch(err) { showToast(err.message,'error'); }
  };

  subCategoryFilter.addEventListener('change', () => { currentSubCategory = subCategoryFilter.value; applyFilters(); });
  searchFilter.addEventListener('input', debounce(() => { currentSearch = searchFilter.value; applyFilters(); }, 300));
  sortFilter.addEventListener('change', () => { currentSort = sortFilter.value; applyFilters(); });

  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  window.addEventListener('popstate', (e) => {
    const id = (e.state && e.state.promptId) || getPromptIdFromLocation();
    if (id && prompts.some(p => p.id === id)) {
      selectPrompt(id, { replaceUrl: true });
    } else {
      selectedPromptId = null;
      renderList();
      if (isMobile()) { promptPreview.classList.remove('fullscreen-mobile'); showEmptyPreview(); }
      else if (filteredPrompts.length) selectPrompt(filteredPrompts[0].id, { replaceUrl: true });
      else showEmptyPreview();
    }
  });

  loadPrompts();
  window.addEventListener('resize', () => {
    if (!isMobile()) {
      promptPreview.classList.remove('fullscreen-mobile');
      const close = promptPreview.querySelector('.preview-close');
      if (close) close.remove();
      if (filteredPrompts.length && (!selectedPromptId || !filteredPrompts.some(p => p.id === selectedPromptId))) {
        selectPrompt(filteredPrompts[0].id);
      } else if (selectedPromptId) {
        renderPreview(selectedPromptId);
      }
    }
  });
})();
</script>
</body>
</html>

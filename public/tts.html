<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SanjayAIHub · Text to Speech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1512;
    --panel:#141E19;
    --panel-2:#182620;
    --line:#243530;
    --amber:#E8A33D;
    --amber-dim:#7A5A2A;
    --sage:#7FA98D;
    --text:#EDEAE2;
    --muted:#8B9A91;
    --danger:#D96A5A;
  }
  .params-panel {
    --ap-muted: var(--muted);
    --ap-border: var(--line);
    --ap-bg: var(--panel-2);
    --ap-text: var(--text);
    --ap-accent: var(--amber);
    margin: 16px 0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top left, rgba(232,163,61,0.06), transparent 45%),
                radial-gradient(ellipse at bottom right, rgba(127,169,141,0.05), transparent 45%),
                var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  header{
    border-bottom:1px solid var(--line);
    padding:22px 32px 0 32px;
  }
  .brand-row{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px;
    margin-bottom:18px;
  }
  .brand h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:42px;
    letter-spacing:2px;
    margin:0;
    line-height:1;
    color:var(--text);
  }
  .brand h1 span{color:var(--amber);}
  .brand p{
    margin:6px 0 0 0;
    color:var(--muted);
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
  }
  .key-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:6px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--muted);
  }
  .key-status.ok{color:var(--sage); border-color:var(--sage);}
  .key-status.bad{color:var(--danger); border-color:var(--danger);}
  .filmstrip{
    position:relative;
    height:34px;
    display:flex;
    align-items:center;
    background:repeating-linear-gradient(90deg, var(--panel) 0 18px, var(--panel-2) 18px 20px);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:4px 4px 0 0;
    overflow:hidden;
  }
  .filmstrip .perf{
    position:absolute; top:4px; bottom:4px; left:0; right:0;
    background-image:repeating-linear-gradient(90deg, transparent 0 12px, var(--bg) 12px 16px, transparent 16px 20px);
    opacity:0.5;
  }
  .filmstrip .progress{
    position:absolute; top:0; bottom:0; left:0; width:0%;
    background:linear-gradient(90deg, rgba(232,163,61,0.35), rgba(232,163,61,0.15));
    transition:width 0.4s ease;
  }
  .filmstrip .tc{
    position:relative; z-index:2;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--amber);
    padding-left:12px;
    letter-spacing:1px;
  }
  .filmstrip .tally{
    position:relative; z-index:2;
    margin-left:auto; margin-right:12px;
    width:9px; height:9px; border-radius:50%;
    background:var(--line);
  }
  .filmstrip .tally.live{ background:var(--amber); box-shadow:0 0 8px var(--amber); animation:pulse 1.1s infinite; }
  .filmstrip .tally.done{ background:var(--sage); box-shadow:0 0 8px var(--sage); animation:none; }
  .filmstrip .tally.err{ background:var(--danger); box-shadow:0 0 8px var(--danger); animation:none; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  main{
    display:grid;
    grid-template-columns: 420px 1fr;
    gap:24px;
    padding:24px 32px 40px 32px;
    max-width:1400px;
    margin:0 auto;
  }
  @media (max-width: 920px){ main{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px;
  }
  label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;
    margin:14px 0 6px 0;
  }
  label.required::after{ content:" *"; color:var(--amber); }
  input[type=text], input[type=url], input[type=number], textarea, select{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:3px;
    color:var(--text); padding:9px 10px; font-family:'Inter',sans-serif; font-size:13px;
    outline:none;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--amber); }
  textarea{ min-height:70px; resize:vertical; font-family:'Inter',sans-serif; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint{ font-size:11px; color:var(--muted); margin-top:4px; }
  button.generate{
    width:100%; margin-top:20px;
    background:var(--amber); color:#1A1206; border:none; border-radius:4px;
    font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:1.5px;
    padding:13px; cursor:pointer;
    transition:filter 0.15s;
  }
  button.generate:hover{ filter:brightness(1.08); }
  button.generate:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; }
  .error-box{
    margin-top:14px; padding:10px 12px; border:1px solid var(--danger); border-radius:3px;
    color:var(--danger); font-family:'IBM Plex Mono',monospace; font-size:12px; display:none;
  }
  .viewfinder{
    min-height:520px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative;
    padding:20px;
  }
  .corner{ position:absolute; width:18px; height:18px; border-color:var(--amber); opacity:0.6; }
  .corner.tl{ top:10px; left:10px; border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:10px; right:10px; border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:10px; left:10px; border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:10px; right:10px; border-bottom:2px solid; border-right:2px solid; }
  .placeholder{ text-align:center; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .placeholder .big{ font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--line); letter-spacing:2px; display:block; margin-bottom:8px;}
  audio{ width:100%; border-radius:4px; border:1px solid var(--line); background:#000; }
  .status-line{
    margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);
    display:flex; align-items:center; gap:8px;
  }
  .status-line .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .status-line .dot.live{ background:var(--amber); animation:pulse 1.1s infinite; }
  .status-line .dot.done{ background:var(--sage); }
  .status-line .dot.err{ background:var(--danger); }
  .actions{ display:flex; gap:10px; margin-top:14px; }
  .actions a{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
    color:var(--sage); text-decoration:none; border:1px solid var(--sage); border-radius:3px;
    padding:7px 12px; letter-spacing:0.5px;
  }
  .actions a:hover{ background:rgba(127,169,141,0.12); }
  .back-link{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);
    text-decoration:none; display:inline-block; margin-top:4px;
  }
  .back-link:hover{ color:var(--amber); }
  footer{
    text-align:center; padding:20px; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:11px;
  }
</style>
</head>
<body>
<header>
  <div class="brand-row">
    <div class="brand">
      <h1>SanjayAI<span>Hub</span></h1>
      <p>Text → Speech · natural voice synthesis</p>
    </div>
    <div class="key-status" id="keyStatus">checking key…</div>
  </div>
  <div class="filmstrip">
    <div class="perf"></div>
    <div class="progress" id="progressFill"></div>
    <span class="tc" id="timecode">00:00:00:00 — IDLE</span>
    <span class="tally" id="tally"></span>
  </div>
</header>
<main>
  <section class="panel">
    <form id="genForm">
      <label class="required">Text to speak</label>
      <textarea id="prompt" placeholder="Welcome to SanjayAIHub. This is a text-to-speech demonstration." maxlength="4000" required></textarea>
      <div>
        <label>Model</label>
        <select id="model">
          <option value="">Loading models...</option>
        </select>
      </div>
      <!-- Adaptive parameter panel: fields are generated entirely from the
           selected provider's schema (select / range / checkbox only — see
           /js/adaptive-params.js). Swaps automatically when the model changes. -->
      <div id="paramsPanel" class="params-panel"></div>
      <button type="submit" class="generate" id="genBtn">🔊 Generate Speech</button>
      <div class="error-box" id="errorBox"></div>
    </form>
    <a href="/" class="back-link">← Back to Hub</a>
  </section>
  <section class="panel viewfinder">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div id="outputArea">
      <div class="placeholder"><span class="big">NO SIGNAL</span>enter text and hit generate</div>
    </div>
    <div class="status-line" id="statusLine" style="display:none;">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">idle</span>
    </div>
    <div class="actions" id="resultActions" style="display:none;">
      <a id="downloadLink" href="#" download target="_blank" rel="noopener">Download MP3</a>
      <a id="openLink" href="#" target="_blank" rel="noopener">Open</a>
    </div>
  </section>
</main>
<footer>SanjayAIHub · Text to Speech · powered by Cloudflare Workers AI</footer>
<script src="/js/auth.js"></script>
<script src="/js/adaptive-params.js"></script>
<script>
  if (!window.AUTH || !AUTH.isLoggedIn()) {
    window.location.href = '/login.html';
  }

  const els = {
    form: document.getElementById("genForm"),
    prompt: document.getElementById("prompt"),
    model: document.getElementById("model"),
    paramsPanel: document.getElementById("paramsPanel"),
    genBtn: document.getElementById("genBtn"),
    errorBox: document.getElementById("errorBox"),
    outputArea: document.getElementById("outputArea"),
    statusLine: document.getElementById("statusLine"),
    statusDot: document.getElementById("statusDot"),
    statusText: document.getElementById("statusText"),
    resultActions: document.getElementById("resultActions"),
    downloadLink: document.getElementById("downloadLink"),
    openLink: document.getElementById("openLink"),
    timecode: document.getElementById("timecode"),
    progressFill: document.getElementById("progressFill"),
    tally: document.getElementById("tally"),
    keyStatus: document.getElementById("keyStatus"),
  };

  // Adaptive parameter panel — mounted once, its schema is swapped every
  // time the selected model changes (see refreshParamsForSelectedModel below).
  const paramsPanel = AdaptiveParams.mount(els.paramsPanel, {});
  let modelToProvider = {};
  let providerParameters = {};

  function refreshParamsForSelectedModel() {
    const provider = modelToProvider[els.model.value] || 'cloudflare';
    paramsPanel.setSchema(providerParameters[provider] || {});
  }

  // Load model catalog dynamically from API
  fetch("/api/modules/text-to-speech/models", { headers: AUTH.getAuthHeader() })
    .then(r => r.json())
    .then(data => {
      if (!data.success) throw new Error('Failed to load models');
      providerParameters = data.parameters || {};
      const modelSelect = els.model;
      modelSelect.innerHTML = '';

      const providers = data.providers || [];
      const modelsByProvider = data.models || {};
      const defaults = data.defaults || {};

      if (providers.includes('cloudflare') && modelsByProvider.cloudflare?.length > 0) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = 'Cloudflare';
        modelsByProvider.cloudflare.forEach(model => {
          const opt = document.createElement('option');
          opt.value = model;
          opt.textContent = model.split('/').pop().replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
          if (model === defaults.cloudflare) opt.selected = true;
          modelToProvider[model] = 'cloudflare';
          optgroup.appendChild(opt);
        });
        modelSelect.appendChild(optgroup);
      }

      if (providers.includes('elevenlabs') && modelsByProvider.elevenlabs?.length > 0) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = 'ElevenLabs';
        modelsByProvider.elevenlabs.forEach(model => {
          const opt = document.createElement('option');
          opt.value = model;
          opt.textContent = model.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
          if (model === defaults.elevenlabs) opt.selected = true;
          modelToProvider[model] = 'elevenlabs';
          optgroup.appendChild(opt);
        });
        modelSelect.appendChild(optgroup);
      }

      // Alibaba only appears in the catalog for paid tiers (server-gated in
      // modules/text-to-speech.js's getModelCatalog) — it synthesizes with a
      // voice already cloned in the Voice Cloning module, not a preset voice.
      if (providers.includes('alibaba') && modelsByProvider.alibaba?.length > 0) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = 'Alibaba Cloud (Cloned Voice)';
        modelsByProvider.alibaba.forEach(model => {
          const opt = document.createElement('option');
          opt.value = model;
          opt.textContent = 'Cloned Voice (Qwen)';
          if (model === defaults.alibaba) opt.selected = true;
          modelToProvider[model] = 'alibaba';
          optgroup.appendChild(opt);
        });
        modelSelect.appendChild(optgroup);
        loadClonedVoiceOptions();
      }

      if (modelSelect.options.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No models available';
        modelSelect.appendChild(opt);
      }

      refreshParamsForSelectedModel();
      modelSelect.addEventListener('change', refreshParamsForSelectedModel);
    })
    .catch(err => {
      console.error('Error loading models:', err);
      els.model.innerHTML = '<option value="">Error loading models</option>';
    });

  // Populate the Alibaba "Cloned Voice" dropdown from the user's own cloned
  // voices (Voice Cloning module). If they haven't configured Alibaba or
  // haven't cloned a voice yet, the select just stays empty with a hint.
  function loadClonedVoiceOptions() {
    fetch("/api/modules/voice-clone/voices", { headers: AUTH.getAuthHeader() })
      .then(r => r.json())
      .then(data => {
        const voices = (data.success && Array.isArray(data.voices)) ? data.voices : [];
        const field = providerParameters.alibaba?.voiceId;
        if (!field) return;
        field.options = voices.map(v => ({ value: v.voice_id, label: v.name || v.voice_id }));
        field.default = field.options[0]?.value || '';
        if (!field.options.length) {
          field.options = [{ value: '', label: 'No cloned voices yet — clone one first' }];
        }
        if (modelToProvider[els.model.value] === 'alibaba') refreshParamsForSelectedModel();
      })
      .catch(err => console.error('Failed to load cloned voices:', err));
  }

  fetch("/api/keys", { headers: AUTH.getAuthHeader() }).then(r=>r.json()).then(d=>{
    const configured = d.keys?.some(k => (k.provider === 'cloudflare' || k.provider === 'elevenlabs' || k.provider === 'alibaba') && k.configured);
    els.keyStatus.textContent = configured ? "✅ TTS key: configured" : "⚠️ No TTS key — add Cloudflare, ElevenLabs, or Alibaba in Profile";
    els.keyStatus.className = "key-status " + (configured ? "ok" : "bad");
  }).catch(()=>{ els.keyStatus.textContent="server unreachable"; els.keyStatus.className="key-status bad"; });

  function setTally(kind){ els.tally.className = "tally" + (kind ? " " + kind : ""); }
  function setProgress(pct){ els.progressFill.style.width = pct + "%"; }
  function fmtElapsed(ms){ const s=Math.floor(ms/1000); return `${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor((s%3600)/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }
  function showError(msg){ els.errorBox.textContent = msg; els.errorBox.style.display = "block"; }
  function clearError(){ els.errorBox.style.display = "none"; }

  els.form.addEventListener("submit", async (e) => {
    e.preventDefault(); clearError();
    const text = els.prompt.value.trim();
    if (!text) return showError("Text is required.");

    els.genBtn.disabled = true; els.genBtn.textContent = "⏳ Generating…";
    els.outputArea.innerHTML = `<div class="placeholder"><span class="big">⏳</span>generating speech…</div>`;
    els.statusLine.style.display = "flex"; els.statusText.textContent = "generating…";
    els.statusDot.className = "dot live"; setTally("live"); setProgress(50);
    const start = Date.now(); els.timecode.textContent = "00:00:00 — RENDERING";
    const timer = setInterval(() => { els.timecode.textContent = fmtElapsed(Date.now() - start) + " — RENDERING"; }, 1000);

    try {
      const res = await fetch("/api/modules/text-to-speech", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...AUTH.getAuthHeader() },
        body: JSON.stringify({
          text,
          model: els.model.value,
          ...paramsPanel.getValues(),
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || "TTS failed.");
      const contentType = data.data.contentType || 'audio/mpeg';
      const url = `data:${contentType};base64,${data.data.audioBase64}`;
      setProgress(100); setTally("done"); els.statusDot.className = "dot done";
      els.statusText.textContent = "complete"; clearInterval(timer);
      els.timecode.textContent = fmtElapsed(Date.now() - start) + " — COMPLETE";
      els.outputArea.innerHTML = `<audio src="${url}" controls autoplay></audio>`;
      els.downloadLink.href = url; els.downloadLink.download = `speech-${Date.now()}.mp3`;
      els.openLink.href = url;
      els.resultActions.style.display = "flex";
    } catch (err) {
      setTally("err"); els.statusDot.className = "dot err";
      els.statusText.textContent = "failed"; showError(err.message);
      els.outputArea.innerHTML = `<div class="placeholder"><span class="big">❌</span>${err.message}</div>`;
    } finally { clearInterval(timer); els.genBtn.disabled = false; els.genBtn.textContent = "🔊 Generate Speech"; }
  });
</script>
</body>
</html>

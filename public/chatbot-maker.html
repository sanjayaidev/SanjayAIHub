<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SanjayAIHub · Chatbot Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0c10;
      min-height: 100vh;
      color: #eef0f7;
      padding: 2rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid #1f2433;
    }
    .header h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .header h1 i { color: #00e8a2; }
    .back-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      color: #8896b0; padding: 8px 16px; border-radius: 10px; cursor: pointer;
      text-decoration: none; font-size: 13px; transition: 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); color: #eef2f9; }

    .create-section {
      background: #0e1016; border: 1px solid #1f2433; border-radius: 16px;
      padding: 2rem; margin-bottom: 2rem;
    }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
    .section-title i { color: #00e8a2; }

    .form-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem; margin-bottom: 1.5rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 13px; font-weight: 500; color: #8b92a8; }
    .form-group input, .form-group textarea, .form-group select {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 12px 14px; color: #eef2f9; font-size: 14px;
      font-family: 'Inter', sans-serif; outline: none; transition: 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: #00e8a2; box-shadow: 0 0 0 3px rgba(0,232,162,0.1);
    }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .form-group input[type="color"] { padding: 4px; height: 44px; cursor: pointer; }

    .btn-primary {
      background: #00e8a2; color: #060d0b; border: none; border-radius: 10px;
      padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: 0.2s; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .configs-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .config-card {
      background: #0e1016; border: 1px solid #1f2433; border-radius: 14px;
      padding: 1.5rem; transition: 0.2s; position: relative;
    }
    .config-card:hover { border-color: #00e8a2; transform: translateY(-2px); }
    .config-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .config-card p { font-size: 13px; color: #8b92a8; margin-bottom: 1rem; line-height: 1.5; }
    .config-meta { font-size: 12px; color: #4f566b; margin-bottom: 1rem; }
    .config-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-sm {
      padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: 0.2s; border: none;
    }
    .btn-view { background: rgba(0,232,162,0.12); color: #00e8a2; border: 1px solid rgba(0,232,162,0.2); }
    .btn-view:hover { background: rgba(0,232,162,0.2); }
    .btn-copy { background: rgba(77,142,255,0.12); color: #4d8eff; border: 1px solid rgba(77,142,255,0.2); }
    .btn-copy:hover { background: rgba(77,142,255,0.2); }
    .btn-delete { background: rgba(255,90,90,0.12); color: #ff6b6b; border: 1px solid rgba(255,90,90,0.2); }
    .btn-delete:hover { background: rgba(255,90,90,0.2); }

    .empty-state {
      text-align: center; padding: 3rem; color: #4f566b;
      border: 2px dashed #1f2433; border-radius: 14px;
    }
    .empty-state i { font-size: 48px; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state p { font-size: 14px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #0e1016; border: 1px solid #1f2433; border-radius: 16px;
      padding: 2rem; max-width: 500px; width: 100%; position: relative;
    }
    .modal h2 { font-size: 18px; margin-bottom: 1rem; }
    .modal-close {
      position: absolute; top: 16px; right: 16px; background: none; border: none;
      color: #4f566b; font-size: 20px; cursor: pointer;
    }
    .modal-close:hover { color: #eef2f9; }
    .embed-code {
      background: #080a0e; border: 1px solid #1f2433; border-radius: 8px;
      padding: 1rem; font-family: monospace; font-size: 12px; color: #00e8a2;
      overflow-x: auto; white-space: pre-wrap; word-break: break-all;
      max-height: 300px; overflow-y: auto; margin: 1rem 0;
    }

    .preview-badge {
      display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px;
      background: rgba(0,232,162,0.12); color: #00e8a2; margin-left: 8px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-robot"></i> Chatbot Maker <span class="preview-badge">Enterprise</span></h1>
    <a href="/home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
  </div>

  <div class="create-section">
    <div class="section-title"><i class="fas fa-plus-circle"></i> Create New Chatbot</div>
    <form id="chatbotForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Chatbot Name *</label>
          <input type="text" id="name" required placeholder="e.g., Customer Support Bot">
        </div>
        <div class="form-group">
          <label>Business Name</label>
          <input type="text" id="businessName" placeholder="Your Business">
        </div>
        <div class="form-group">
          <label>Business Color</label>
          <input type="color" id="businessColor" value="#00e8a2">
        </div>
        <div class="form-group">
          <label>Position</label>
          <select id="position">
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom-left">Bottom Left</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label>System Prompt *</label>
        <textarea id="systemPrompt" required placeholder="Define your chatbot's personality and behavior. Example: You are a helpful customer support assistant for an e-commerce store. Be friendly, concise, and always try to help customers find what they need."></textarea>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Welcome Message</label>
          <input type="text" id="welcomeMessage" placeholder="Hello! How can I help you today?">
        </div>
        <div class="form-group">
          <label>Input Placeholder</label>
          <input type="text" id="placeholderText" placeholder="Type your message...">
        </div>
      </div>
      <button type="submit" class="btn-primary" style="margin-top: 1.5rem;">
        <i class="fas fa-save"></i> Create Chatbot
      </button>
    </form>
  </div>

  <div class="section-title"><i class="fas fa-list"></i> Your Chatbots</div>
  <div id="configsList" class="configs-list">
    <div class="empty-state">
      <i class="fas fa-robot"></i>
      <p>No chatbots created yet. Create your first chatbot above!</p>
    </div>
  </div>
</div>

<!-- Embed Modal -->
<div id="embedModal" class="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeEmbedModal()">✕</button>
    <h2><i class="fas fa-code"></i> Embed Code</h2>
    <p style="font-size: 13px; color: #8b92a8; margin-bottom: 1rem;">Copy this code and paste it into any webpage where you want the chatbot to appear.</p>
    <div id="embedCode" class="embed-code"></div>
    <button class="btn-primary btn-sm" onclick="copyEmbedCode()">
      <i class="fas fa-copy"></i> Copy to Clipboard
    </button>
  </div>
</div>

<script>
let currentEmbedCode = '';

async function loadConfigs() {
  try {
    const res = await fetch('/api/chatbot-maker/configs', { headers: getAuthHeader() });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.message);
    
    const listEl = document.getElementById('configsList');
    
    if (!data.configs || data.configs.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-robot"></i>
          <p>No chatbots created yet. Create your first chatbot above!</p>
        </div>
      `;
      return;
    }
    
    listEl.innerHTML = data.configs.map(config => `
      <div class="config-card">
        <h3>${escapeHtml(config.name)}</h3>
        <p>${escapeHtml(config.system_prompt.substring(0, 100))}${config.system_prompt.length > 100 ? '...' : ''}</p>
        <div class="config-meta">
          <div><i class="fas fa-building"></i> ${escapeHtml(config.business_name || 'Business')}</div>
          <div><i class="fas fa-palette"></i> <span style="color: ${config.business_color};">${config.business_color}</span></div>
          <div><i class="fas fa-clock"></i> ${new Date(config.created_at).toLocaleDateString()}</div>
        </div>
        <div class="config-actions">
          <button class="btn-sm btn-view" onclick="viewConfig('${config.id}')">
            <i class="fas fa-eye"></i> View
          </button>
          <button class="btn-sm btn-copy" onclick="getEmbedCode('${config.id}')">
            <i class="fas fa-code"></i> Get Code
          </button>
          <button class="btn-sm btn-delete" onclick="deleteConfig('${config.id}')">
            <i class="fas fa-trash"></i> Delete
          </button>
        </div>
      </div>
    `).join('');
  } catch (error) {
    console.error('Failed to load configs:', error);
    alert('Failed to load chatbot configurations');
  }
}

async function createConfig(e) {
  e.preventDefault();
  
  const config = {
    name: document.getElementById('name').value,
    business_name: document.getElementById('businessName').value,
    business_color: document.getElementById('businessColor').value,
    position: document.getElementById('position').value,
    system_prompt: document.getElementById('systemPrompt').value,
    welcome_message: document.getElementById('welcomeMessage').value,
    placeholder_text: document.getElementById('placeholderText').value
  };
  
  try {
    const res = await fetch('/api/chatbot-maker/configs', {
      method: 'POST',
      headers: { ...getAuthHeader(), 'Content-Type': 'application/json' },
      body: JSON.stringify(config)
    });
    
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    
    alert('Chatbot created successfully!');
    document.getElementById('chatbotForm').reset();
    document.getElementById('businessColor').value = '#00e8a2';
    loadConfigs();
  } catch (error) {
    alert('Failed to create chatbot: ' + error.message);
  }
}

async function deleteConfig(id) {
  if (!confirm('Are you sure you want to delete this chatbot?')) return;
  
  try {
    const res = await fetch(`/api/chatbot-maker/configs/${id}`, {
      method: 'DELETE',
      headers: getAuthHeader()
    });
    
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    
    loadConfigs();
  } catch (error) {
    alert('Failed to delete chatbot: ' + error.message);
  }
}

async function getEmbedCode(id) {
  try {
    const res = await fetch(`/api/chatbot-maker/embed/${id}`);
    const script = await res.text();
    
    currentEmbedCode = script;
    document.getElementById('embedCode').textContent = script;
    document.getElementById('embedModal').classList.add('active');
  } catch (error) {
    alert('Failed to get embed code: ' + error.message);
  }
}

function closeEmbedModal() {
  document.getElementById('embedModal').classList.remove('active');
}

function copyEmbedCode() {
  navigator.clipboard.writeText(currentEmbedCode).then(() => {
    alert('Embed code copied to clipboard!');
    closeEmbedModal();
  }).catch(() => {
    alert('Failed to copy to clipboard');
  });
}

function viewConfig(id) {
  window.open(`/api/chatbot-maker/embed/${id}`, '_blank');
}

function getAuthHeader() {
  const token = localStorage.getItem('token');
  return token ? { 'Authorization': `Bearer ${token}` } : {};
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.getElementById('chatbotForm').addEventListener('submit', createConfig);
loadConfigs();
</script>
</body>
</html>
